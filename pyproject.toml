[project]
name = "quickcoach-mcp"
version = "1.1.0"
description = "Connect QuickCoach to Claude Code, ChatGPT and any AI agent through Cotlet.dev, a hosted MCP server. No QuickCoach API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["quickcoach", "quickcoach api", "quickcoach mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/quickcoach-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=quickcoach"
Source = "https://github.com/cotlet-connect/quickcoach-mcp"

[project.scripts]
quickcoach-mcp = "quickcoach_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"quickcoach_agent.py" = "quickcoach_agent.py"

[tool.hatch.build.targets.sdist]
include = ["quickcoach_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
